name: Build and validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      windows-probe:
        description: Run only Windows GPU diagnostics; cannot produce release archives.
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      release-version:
        description: Optional release tag; must match both executable packages.
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_STRIP: debuginfo
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  RUSTUP_TOOLCHAIN: stable
  RUSTFLAGS: ""
  ACID_RAIN_PORTABLE: "1"

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.windows-probe }}
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-feature=+crt-static' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            extension: ""
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            extension: .exe
          - os: macos-15
            target: aarch64-apple-darwin
            extension: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            extension: ""
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.14"
          enable-cache: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup target add "${{ matrix.target }}" --toolchain stable
          rustc --version
          cargo --version
          mkdir -p artifacts
      - name: Cache portable Rust dependencies by target and release profile
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}-release-portable-v1
          workspaces: . -> target
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET ACID_RAIN_PORTABLE
          cache-bin: false
          cache-workspace-crates: false
          # Preserve compiled dependencies when later GPU execution fails.
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Prepare checksum-verified Windows shader compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv run --no-project --python 3.14 python scripts/prepare_dxc.py --output-dir "target/${{ matrix.target }}/release"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = (Resolve-Path "target/${{ matrix.target }}/release/dxcompiler.dll").Path
          "ACID_RAIN_DXC_PATH=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Copy-Item "target/${{ matrix.target }}/release/dxc-provenance.json" artifacts/dxc-provenance.json
      - name: Install Linux window-system and software Vulkan dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libvulkan-dev mesa-vulkan-drivers vulkan-tools
          mkdir -p "$RUNNER_TEMP/acid-rain-xdg"
          chmod 700 "$RUNNER_TEMP/acid-rain-xdg"
      - name: Check locked workspace before compilation
        run: cargo check --locked --workspace --all-targets --target "${{ matrix.target }}"
      - name: Check platform code with Clippy
        run: cargo clippy --locked --workspace --all-targets --target "${{ matrix.target }}" -- -D warnings
      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt
          cargo +nightly fmt --all -- --check
      - name: CPU tests and WGSL validation
        run: cargo test --locked --workspace --all-targets --release --target "${{ matrix.target }}" 2>&1 | tee artifacts/cpu-and-shader-tests.log
      - name: Check release archive integrity tests
        run: uv run --no-project --python 3.14 python -m unittest discover -s scripts -p 'test_*.py'
      - name: Build portable desktop and terminal
        id: portable-build
        run: cargo build --locked --release --target "${{ matrix.target }}" -p acid-rain -p acid-rain-desktop
      - name: Inspect Windows runtime imports
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'Visual Studio C++ tools were not found.' }
          $toolset = Get-ChildItem (Join-Path $installation 'VC/Tools/MSVC') -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $dumpbin = Join-Path $toolset.FullName 'bin/Hostx64/x64/dumpbin.exe'
          if (!(Test-Path $dumpbin -PathType Leaf)) { throw 'dumpbin.exe was not found.' }
          Set-Content artifacts/windows-pe-tool.txt $dumpbin
          foreach ($name in @('acid-rain.exe', 'acid-rain-desktop.exe', 'dxcompiler.dll')) {
            $binary = "target/${{ matrix.target }}/release/$name"
            $stem = [IO.Path]::GetFileNameWithoutExtension($name)
            $log = "artifacts/windows-pe-$stem.log"
            & $dumpbin /dependents /imports $binary 2>&1 | Set-Content $log
            if ($LASTEXITCODE -ne 0) { throw "PE import inspection failed: $name" }
            Select-String -Path $log -Pattern '^\s+\S+\.dll\s*$' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique
            if (Select-String -Path $log -Pattern '\b(?:VCRUNTIME|MSVCP|MSVCR[0-9]|CONCRT|VCOMP)[^\s]*\.dll\b' -Quiet) {
              throw "Portable executable depends on a Visual C++ redistributable DLL: $name"
            }
          }
      - name: Required real shader execution on Linux software Vulkan
        if: runner.os == 'Linux'
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          XDG_RUNTIME_DIR: ${{ runner.temp }}/acid-rain-xdg
          WGPU_BACKEND: vulkan
          ACID_RAIN_GPU_TESTS: "1"
          ACID_RAIN_SOFTWARE: "1"
        run: |
          vulkaninfo --summary > artifacts/vulkan-adapter.txt 2>&1
          cargo test --locked --release -p acid-rain-desktop --target "${{ matrix.target }}" -- --nocapture --test-threads=1 2>&1 | tee artifacts/software-vulkan-tests.log
          "target/${{ matrix.target }}/release/acid-rain-desktop" --headless --backend vulkan --software --frames 12 --warmup 2 --size 320x200 --output artifacts/linux-vulkan.png --report artifacts/linux-vulkan.json
          printf '%s\n' 'These software Vulkan results validate rendering and numerical correctness. They are not hardware GPU performance measurements.' > artifacts/SOFTWARE-RENDERING.txt
      - name: Required real shader execution on Windows software DirectX 12
        if: runner.os == 'Windows'
        env:
          WGPU_BACKEND: dx12
          ACID_RAIN_GPU_TESTS: "1"
          ACID_RAIN_SOFTWARE: "1"
        run: cargo test --locked --release -p acid-rain-desktop --target "${{ matrix.target }}" -- --nocapture --test-threads=1 2>&1 | tee artifacts/software-dx12-tests.log
      - name: Windows software DirectX 12 rendering
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.portable-build.outcome == 'success' }}
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "target/${{ matrix.target }}/release/acid-rain-desktop.exe" -ArgumentList @('--headless', '--backend', 'dx12', '--software', '--frames', '12', '--warmup', '2', '--size', '320x200', '--output', 'artifacts/windows-warp.png', '--report', 'artifacts/windows-warp.json') -Wait -PassThru -NoNewWindow -RedirectStandardOutput artifacts/windows-warp.stdout.log -RedirectStandardError artifacts/windows-warp.stderr.log
          Get-Content artifacts/windows-warp.stdout.log, artifacts/windows-warp.stderr.log | Set-Content artifacts/windows-warp.log
          Get-Content artifacts/windows-warp.log
          if ($process.ExitCode -ne 0) {
            if (Select-String -Path artifacts/windows-warp.log -SimpleMatch 'No compatible graphics adapter:' -Quiet) {
              Set-Content artifacts/windows-warp-SKIPPED.txt 'SKIPPED: the hosted runner exposes no compatible software DX12 adapter.'
              Write-Output '::warning::WARP adapter unavailable; Windows GPU execution was not verified. See validation evidence.'
            } else {
              $primaryExitCode = $process.ExitCode
              try {
                Set-Content artifacts/windows-warp-serialized-NOT-A-BENCHMARK.txt 'This diagnostic serializes and waits after production GPU passes. Its timing does not represent normal rendering performance.'
                $probe = Start-Process -FilePath "target/${{ matrix.target }}/release/acid-rain-desktop.exe" -ArgumentList @('--headless', '--backend', 'dx12', '--software', '--quality', 'high', '--diagnose-gpu-passes', '--frames', '12', '--warmup', '2', '--size', '320x200', '--output', 'artifacts/windows-warp-serialized.png', '--report', 'artifacts/windows-warp-serialized.json') -Wait -PassThru -NoNewWindow -RedirectStandardOutput artifacts/windows-warp-serialized.stdout.log -RedirectStandardError artifacts/windows-warp-serialized.stderr.log
                Set-Content artifacts/windows-warp-serialized.exitcode.txt $probe.ExitCode
                Get-Content artifacts/windows-warp-serialized.stdout.log, artifacts/windows-warp-serialized.stderr.log | Set-Content artifacts/windows-warp-serialized.log
                Get-Content artifacts/windows-warp-serialized.log
              } catch {
                $_ | Out-String | Set-Content artifacts/windows-warp-serialized-launch-error.log
              }
              exit $primaryExitCode
            }
          } elseif (!(Test-Path artifacts/windows-warp.png -PathType Leaf) -or !(Test-Path artifacts/windows-warp.json -PathType Leaf)) {
            throw 'The headless GUI process exited successfully without its PNG and JSON capture.'
          }
          Set-Content artifacts/SOFTWARE-RENDERING.txt 'Windows WARP is a software renderer. These results validate execution, not hardware GPU FPS.'
      - name: Build original native Metal app on Apple Silicon
        if: matrix.target == 'aarch64-apple-darwin'
        run: ./native/build.sh 2>&1 | tee artifacts/native-build.log
      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          uv run --no-project --python 3.14 python - <<'PY'
          import os, pathlib, tomllib
          root = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          desktop = tomllib.loads(pathlib.Path('desktop/Cargo.toml').read_text())['package']['version']
          tag = os.environ.get('RELEASE_VERSION') or ('v' + root)
          if tag != 'v' + root or root != desktop:
              raise SystemExit(f'Release tag {tag!r} does not match packages {root!r} and {desktop!r}')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'PACKAGE_VERSION={tag}\n')
          PY
      - name: Package desktop, terminal, documentation and checksums
        run: |
          extra=()
          if [[ "${{ matrix.target }}" == 'aarch64-apple-darwin' ]]; then
            extra+=(--native-app 'native/build/Acid Rain.app')
          fi
          uv run --no-project --python 3.14 python scripts/package_release.py package --target "${{ matrix.target }}" --version "$PACKAGE_VERSION" --bin-dir "target/${{ matrix.target }}/release" --output dist "${extra[@]}"
          uv run --no-project --python 3.14 python scripts/package_release.py manifest --directory dist --expected 1
      - name: Upload archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve Windows binaries for failure diagnosis
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-windows-binaries
          path: |
            target/x86_64-pc-windows-msvc/release/acid-rain.exe
            target/x86_64-pc-windows-msvc/release/acid-rain-desktop.exe
            target/x86_64-pc-windows-msvc/release/dxcompiler.dll
            target/x86_64-pc-windows-msvc/release/dxc-provenance.json
            target/x86_64-pc-windows-msvc/release/licenses/dxc/
          if-no-files-found: warn
          retention-days: 14
  windows-probe:
    name: Windows GPU profiling probe
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows-probe }}
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.14"
          enable-cache: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup target add x86_64-pc-windows-msvc --toolchain stable
          rustc --version
          cargo --version
          mkdir -p artifacts
      - name: Reuse portable Windows validation dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Match the regular Windows validate job's prefix, including its job ID.
          shared-key: x86_64-pc-windows-msvc-release-portable-v1-validate
          workspaces: . -> target
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET ACID_RAIN_PORTABLE
          cache-bin: false
          cache-workspace-crates: false
          cache-on-failure: true
      - name: Record diagnostic source provenance
        shell: pwsh
        run: |
          @{
            repository = $env:GITHUB_REPOSITORY
            commit = $env:GITHUB_SHA
            checked_out_commit = (& git rev-parse HEAD)
            run_id = $env:GITHUB_RUN_ID
            workflow = $env:GITHUB_WORKFLOW
            ref = $env:GITHUB_REF
            release_eligible = $false
          } | ConvertTo-Json | Set-Content artifacts/probe-source.json
          Set-Content artifacts/NOT-A-RELEASE.txt 'Windows-only diagnostic. This run does not validate all platforms and cannot supply release archives. Debug validation and serialized passes are diagnostic overhead; software-driver timings are not hardware GPU performance measurements.'
      - name: Check locked desktop before compilation
        run: cargo check --locked -p acid-rain-desktop --all-targets --target x86_64-pc-windows-msvc
      - name: Prepare checksum-verified Windows shader compiler
        shell: pwsh
        run: |
          uv run --no-project --python 3.14 python scripts/prepare_dxc.py --output-dir target/x86_64-pc-windows-msvc/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = (Resolve-Path target/x86_64-pc-windows-msvc/release/dxcompiler.dll).Path
          "ACID_RAIN_DXC_PATH=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Copy-Item target/x86_64-pc-windows-msvc/release/dxc-provenance.json artifacts/dxc-provenance.json
      - name: Build portable desktop
        run: cargo build --locked --release -p acid-rain-desktop --target x86_64-pc-windows-msvc
      - name: Run independent timestamp and full-scene probes
        shell: pwsh
        env:
          WGPU_BACKEND: dx12
          WGPU_DEBUG: "0"
          WGPU_VALIDATION: "1"
          ACID_RAIN_GPU_TESTS: "1"
          ACID_RAIN_SOFTWARE: "1"
        run: |
          function Invoke-Probe([string]$Name, [string]$Program, [string[]]$Arguments, [int]$TimeoutSeconds = 180) {
            $stdout = "artifacts/$Name.stdout.log"
            $stderr = "artifacts/$Name.stderr.log"
            try {
              $process = Start-Process -FilePath $Program -ArgumentList $Arguments -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
              if (!$process.WaitForExit($TimeoutSeconds * 1000)) {
                $process.Kill($true)
                $process.WaitForExit()
                Set-Content "artifacts/$Name.timeout.txt" "Process tree terminated after $TimeoutSeconds seconds."
                Set-Content "artifacts/$Name.exitcode.txt" 124
                Get-Content $stdout, $stderr | Set-Content "artifacts/$Name.log"
                return 124
              }
              $process.WaitForExit()
              Get-Content $stdout, $stderr | Set-Content "artifacts/$Name.log"
              Get-Content "artifacts/$Name.log" | Write-Host
              Set-Content "artifacts/$Name.exitcode.txt" $process.ExitCode
              return [int]$process.ExitCode
            } catch {
              $_ | Out-String | Set-Content "artifacts/$Name.launch-error.log"
              Set-Content "artifacts/$Name.exitcode.txt" 1
              return 1
            }
          }
          $results = @{}
          $results.timestamp_fixture = Invoke-Probe -Name 'timestamp-fixture' -Program 'cargo.exe' -TimeoutSeconds 600 -Arguments @('test', '--release', '--locked', '-p', 'acid-rain-desktop', '--target', 'x86_64-pc-windows-msvc', '--lib', 'timestamp_query_spans', '--', '--nocapture', '--test-threads=1')
          if ($results.timestamp_fixture -eq 0 -and !(Select-String -Path artifacts/timestamp-fixture.log -SimpleMatch 'test result: ok. 2 passed;' -Quiet)) {
            $results.timestamp_fixture = 1
            Set-Content artifacts/timestamp-fixture.missing-tests.txt 'The expected two timestamp tests did not both execute successfully.'
          }
          foreach ($marker in @('Timestamp fixture PASS serialized=false', 'Timestamp fixture PASS serialized=true')) {
            if ($results.timestamp_fixture -eq 0 -and !(Select-String -Path artifacts/timestamp-fixture.log -SimpleMatch $marker -Quiet)) {
              $results.timestamp_fixture = 1
              Set-Content artifacts/timestamp-fixture.missing-execution.txt "A required query fixture did not execute: $marker"
            }
          }
          $binary = 'target/x86_64-pc-windows-msvc/release/acid-rain-desktop.exe'
          $common = @('--headless', '--backend', 'dx12', '--software', '--quality', 'high', '--frames', '12', '--warmup', '2', '--size', '320x200')
          $results.normal_capture = Invoke-Probe -Name 'normal-capture' -Program $binary -Arguments ($common + @('--output', 'artifacts/normal-capture.png', '--report', 'artifacts/normal-capture.json'))
          $results.no_timestamps_capture = Invoke-Probe -Name 'no-timestamps-capture' -Program $binary -Arguments ($common + @('--no-gpu-timestamps', '--output', 'artifacts/no-timestamps-capture.png', '--report', 'artifacts/no-timestamps-capture.json'))
          $results.serialized_capture = Invoke-Probe -Name 'serialized-capture' -Program $binary -Arguments ($common + @('--diagnose-gpu-passes', '--output', 'artifacts/serialized-capture.png', '--report', 'artifacts/serialized-capture.json'))
          $results.serialized_no_timestamps_capture = Invoke-Probe -Name 'serialized-no-timestamps-capture' -Program $binary -Arguments ($common + @('--diagnose-gpu-passes', '--no-gpu-timestamps', '--output', 'artifacts/serialized-no-timestamps-capture.png', '--report', 'artifacts/serialized-no-timestamps-capture.json'))
          # DEBUG disables shader optimization; isolate that variable from native validation.
          $env:WGPU_DEBUG = '1'
          try {
            $results.unoptimized_capture = Invoke-Probe -Name 'unoptimized-capture' -Program $binary -Arguments ($common + @('--output', 'artifacts/unoptimized-capture.png', '--report', 'artifacts/unoptimized-capture.json'))
          } finally {
            $env:WGPU_DEBUG = '0'
          }
          foreach ($capture in @(@('normal_capture', 'normal-capture'), @('no_timestamps_capture', 'no-timestamps-capture'), @('serialized_capture', 'serialized-capture'), @('serialized_no_timestamps_capture', 'serialized-no-timestamps-capture'), @('unoptimized_capture', 'unoptimized-capture'))) {
            if ($results[$capture[0]] -eq 0 -and (!(Test-Path "artifacts/$($capture[1]).png" -PathType Leaf) -or !(Test-Path "artifacts/$($capture[1]).json" -PathType Leaf))) {
              $results[$capture[0]] = 1
              Set-Content "artifacts/$($capture[1]).missing-output.txt" 'Successful process exit did not produce both capture files.'
            }
          }
          $results | ConvertTo-Json | Set-Content artifacts/probe-results.json
          if (@($results.Values | Where-Object { $_ -ne 0 }).Count -gt 0) {
            throw 'One or more diagnostic probes failed; all available independent results were retained.'
          }
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-gpu-probe
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
