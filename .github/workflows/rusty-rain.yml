name: Build and validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-version:
        description: Optional release tag; must match both executable packages.
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_STRIP: debuginfo
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  RUSTUP_TOOLCHAIN: stable
  RUSTFLAGS: ""
  ACID_RAIN_PORTABLE: "1"

jobs:
  validate:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-feature=+crt-static' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            extension: ""
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            extension: .exe
          - os: macos-15
            target: aarch64-apple-darwin
            extension: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            extension: ""
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.14"
          enable-cache: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup target add "${{ matrix.target }}" --toolchain stable
          rustc --version
          cargo --version
          mkdir -p artifacts
      - name: Cache portable Rust dependencies by target and release profile
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}-release-portable-v1
          workspaces: . -> target
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET ACID_RAIN_PORTABLE
          cache-bin: false
          cache-workspace-crates: false
          # Preserve compiled dependencies when later GPU execution fails.
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install Linux window-system and software Vulkan dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libvulkan-dev mesa-vulkan-drivers vulkan-tools
          mkdir -p "$RUNNER_TEMP/acid-rain-xdg"
          chmod 700 "$RUNNER_TEMP/acid-rain-xdg"
      - name: Check locked workspace before compilation
        run: cargo check --locked --workspace --all-targets --target "${{ matrix.target }}"
      - name: Check platform code with Clippy
        run: cargo clippy --locked --workspace --all-targets --target "${{ matrix.target }}" -- -D warnings
      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt
          cargo +nightly fmt --all -- --check
      - name: CPU tests and WGSL validation
        run: cargo test --locked --workspace --all-targets --release --target "${{ matrix.target }}" 2>&1 | tee artifacts/cpu-and-shader-tests.log
      - name: Check release archive integrity tests
        run: uv run --no-project --python 3.14 python -m unittest discover -s scripts -p test_package_release.py
      - name: Build portable desktop and terminal
        run: cargo build --locked --release --target "${{ matrix.target }}" -p acid-rain -p acid-rain-desktop
      - name: Inspect Windows runtime imports
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'Visual Studio C++ tools were not found.' }
          $toolset = Get-ChildItem (Join-Path $installation 'VC/Tools/MSVC') -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $dumpbin = Join-Path $toolset.FullName 'bin/Hostx64/x64/dumpbin.exe'
          if (!(Test-Path $dumpbin -PathType Leaf)) { throw 'dumpbin.exe was not found.' }
          Set-Content artifacts/windows-pe-tool.txt $dumpbin
          foreach ($name in @('acid-rain', 'acid-rain-desktop')) {
            $binary = "target/${{ matrix.target }}/release/$name.exe"
            $log = "artifacts/windows-pe-$name.log"
            & $dumpbin /dependents /imports $binary 2>&1 | Set-Content $log
            if ($LASTEXITCODE -ne 0) { throw "PE import inspection failed: $name" }
            Select-String -Path $log -Pattern '^\s+\S+\.dll\s*$' | ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique
            if (Select-String -Path $log -Pattern '\b(?:VCRUNTIME|MSVCP|MSVCR[0-9]|CONCRT|VCOMP)[^\s]*\.dll\b' -Quiet) {
              throw "Portable executable depends on a Visual C++ redistributable DLL: $name"
            }
          }
      - name: Required real shader execution on Linux software Vulkan
        if: runner.os == 'Linux'
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          XDG_RUNTIME_DIR: ${{ runner.temp }}/acid-rain-xdg
          WGPU_BACKEND: vulkan
          ACID_RAIN_GPU_TESTS: "1"
          ACID_RAIN_SOFTWARE: "1"
        run: |
          vulkaninfo --summary > artifacts/vulkan-adapter.txt 2>&1
          cargo test --locked --release -p acid-rain-desktop --target "${{ matrix.target }}" -- --nocapture 2>&1 | tee artifacts/software-vulkan-tests.log
          "target/${{ matrix.target }}/release/acid-rain-desktop" --headless --backend vulkan --software --frames 12 --warmup 2 --size 320x200 --output artifacts/linux-vulkan.png --report artifacts/linux-vulkan.json
          printf '%s\n' 'These software Vulkan results validate rendering and numerical correctness. They are not hardware GPU performance measurements.' > artifacts/SOFTWARE-RENDERING.txt
      - name: Windows software DirectX 12 rendering
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "target/${{ matrix.target }}/release/acid-rain-desktop.exe" -ArgumentList @('--headless', '--backend', 'dx12', '--software', '--frames', '12', '--warmup', '2', '--size', '320x200', '--output', 'artifacts/windows-warp.png', '--report', 'artifacts/windows-warp.json') -Wait -PassThru -NoNewWindow -RedirectStandardOutput artifacts/windows-warp.stdout.log -RedirectStandardError artifacts/windows-warp.stderr.log
          Get-Content artifacts/windows-warp.stdout.log, artifacts/windows-warp.stderr.log | Set-Content artifacts/windows-warp.log
          Get-Content artifacts/windows-warp.log
          if ($process.ExitCode -ne 0) {
            if (Select-String -Path artifacts/windows-warp.log -SimpleMatch 'No compatible graphics adapter:' -Quiet) {
              Set-Content artifacts/windows-warp-SKIPPED.txt 'SKIPPED: the hosted runner exposes no compatible software DX12 adapter.'
              Write-Output '::warning::WARP adapter unavailable; Windows GPU execution was not verified. See validation evidence.'
            } else {
              $primaryExitCode = $process.ExitCode
              try {
                $probe = Start-Process -FilePath "target/${{ matrix.target }}/release/acid-rain-desktop.exe" -ArgumentList @('--headless', '--backend', 'dx12', '--software', '--quality', 'low', '--frames', '12', '--warmup', '2', '--size', '64x40', '--output', 'artifacts/windows-warp-low.png', '--report', 'artifacts/windows-warp-low.json') -Wait -PassThru -NoNewWindow -RedirectStandardOutput artifacts/windows-warp-low.stdout.log -RedirectStandardError artifacts/windows-warp-low.stderr.log
                Set-Content artifacts/windows-warp-low.exitcode.txt $probe.ExitCode
                Get-Content artifacts/windows-warp-low.stdout.log, artifacts/windows-warp-low.stderr.log | Set-Content artifacts/windows-warp-low.log
                Get-Content artifacts/windows-warp-low.log
              } catch {
                $_ | Out-String | Set-Content artifacts/windows-warp-low-launch-error.log
              }
              exit $primaryExitCode
            }
          } elseif (!(Test-Path artifacts/windows-warp.png -PathType Leaf) -or !(Test-Path artifacts/windows-warp.json -PathType Leaf)) {
            throw 'The headless GUI process exited successfully without its PNG and JSON capture.'
          }
          Set-Content artifacts/SOFTWARE-RENDERING.txt 'Windows WARP is a software renderer. These results validate execution, not hardware GPU FPS.'
      - name: Build original native Metal app on Apple Silicon
        if: matrix.target == 'aarch64-apple-darwin'
        run: ./native/build.sh 2>&1 | tee artifacts/native-build.log
      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          uv run --no-project --python 3.14 python - <<'PY'
          import os, pathlib, tomllib
          root = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          desktop = tomllib.loads(pathlib.Path('desktop/Cargo.toml').read_text())['package']['version']
          tag = os.environ.get('RELEASE_VERSION') or ('v' + root)
          if tag != 'v' + root or root != desktop:
              raise SystemExit(f'Release tag {tag!r} does not match packages {root!r} and {desktop!r}')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'PACKAGE_VERSION={tag}\n')
          PY
      - name: Package desktop, terminal, documentation and checksums
        run: |
          extra=()
          if [[ "${{ matrix.target }}" == 'aarch64-apple-darwin' ]]; then
            extra+=(--native-app 'native/build/Acid Rain.app')
          fi
          uv run --no-project --python 3.14 python scripts/package_release.py package --target "${{ matrix.target }}" --version "$PACKAGE_VERSION" --bin-dir "target/${{ matrix.target }}/release" --output dist "${extra[@]}"
          uv run --no-project --python 3.14 python scripts/package_release.py manifest --directory dist --expected 1
      - name: Upload archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve Windows binaries for failure diagnosis
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-windows-binaries
          path: |
            target/x86_64-pc-windows-msvc/release/acid-rain.exe
            target/x86_64-pc-windows-msvc/release/acid-rain-desktop.exe
          if-no-files-found: warn
          retention-days: 14
