[package]
name = "acid-rain"
version = "0.1.0"
authors = ["yampolson <https://github.com/Yamp>"]
edition = "2021"
description = "Emulate screensaver."
repository = "https://github.com/Yamp/acid-rain"
documentation = "https://docs.rs/acid-rain"
homepage = "https://github.com/Yamp/acid-rain"
license = "Apache-2.0"
keywords = ["rain", "acid-rain", "cmatrix", "animation", "screensaver"]
categories = ["command-line-utilities"]

[dependencies]
clap = {version = "^4.4.18", features = ["derive", "unstable-v5", "wrap_help"]}
crossterm = "^0.27.0"
rand = "^0.8.5"
itertools = "^0.12.0"
ezemoji = "^0.2.1"
ndarray = "^0.15.6"
once_cell = "^1.19.0"
anyhow = { version = "^1.0.79", features = [] }

[profile.release]
codegen-units = 1
# Use optimizations for release
debug = true
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = false  # Disable integer overflow checks.
panic = "unwind"
# rustflags requires nightly cargo-features; use RUSTFLAGS env var instead
