[package]
name = "acid-rain-desktop"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
publish = false
license = "Apache-2.0"
description = "GPU water and psychedelic optics for Windows, Linux and macOS"

[dependencies]
acid-rain-native-core = { path = "../native/core" }
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "=4.4.18", features = ["derive"] }
egui = "=0.33.3"
egui-wgpu = "=0.33.3"
egui-winit = "=0.33.3"
half = { version = "2", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "=0.4.34"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "=27.0.1"
winit = "=0.30.12"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.58.0", features = ["Win32_Graphics_Direct3D12"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
naga = { version = "=27.0.3", features = ["wgsl-in", "hlsl-out"] }
